<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de Endemias de São Luís – estudo preliminar de implantação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#20242B; --muted:#5B6370; --line:#C9CED6; --paper:#FFFFFF; --table:#EEF1F4; --accent:#1D4E89; --accent-soft:#E3ECF7;
  --sans:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --cond:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--table);display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;padding:14px 22px;background:var(--paper);border-bottom:1px solid var(--line)}
header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em}
header p{margin:0;font-size:14px;color:var(--muted)}
.notice{margin-left:auto;font-size:13px;color:#7A3B0F;background:#FBEBDD;border:1px solid #EBC7A6;padding:4px 10px;border-radius:4px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
#mapwrap{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#mapwrap.dragging{cursor:grabbing}
svg#map{width:100%;height:100%;display:block;user-select:none}
.tools{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.tools button{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font:500 20px var(--sans);color:var(--ink);cursor:pointer}
.tools button.wide{font-size:12px;line-height:14px}
.tools button:hover{background:var(--accent-soft)}
.hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:4px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.room{cursor:pointer}
.room rect{transition:opacity .15s}
#world rect,#world line,#world polyline{vector-effect:non-scaling-stroke}
.room rect.body{stroke-width:1.4px}
.room:hover rect.body{stroke-width:2.5px}
.room:focus{outline:none}
.room:focus-visible rect.body{stroke:var(--accent);stroke-width:3px;stroke-dasharray:6 3}
.room.sel rect.body{stroke:var(--accent);stroke-width:3.5px}
.dim .room:not(.inset) rect, .dim .room:not(.inset) text{opacity:.22}
.room text{font-family:var(--cond);fill:#1d1d1b;pointer-events:none}
aside{background:var(--paper);border-left:1px solid var(--line);overflow:auto;padding:22px 24px 40px}
aside h2{font-size:22px;line-height:1.2;margin:8px 0 6px;font-weight:600}
aside h3{font-size:15px;margin:22px 0 8px;font-weight:600}
aside p{font-size:14px;line-height:1.55;margin:0 0 10px;color:#2E333B}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chip i{width:16px;height:12px;border-radius:2px;border:1.5px solid}
.area{font:600 15px var(--cond);color:var(--ink);margin:2px 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th:nth-child(1){width:34%}th:nth-child(2){width:13%}
th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 6px 6px 0}
td{vertical-align:top;border-bottom:1px solid #E6E9ED;padding:7px 6px 7px 0;line-height:1.45}
td.q{text-align:center;font-weight:600;overflow-wrap:anywhere}
ul{padding-left:18px;margin:0}
li{font-size:13.5px;line-height:1.5;margin:0 0 5px}
.legend button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px;font:14px var(--sans);color:var(--ink);cursor:pointer;min-height:44px}
.legend button:hover,.legend button[aria-pressed="true"]{background:var(--accent-soft);border-color:#BCD0E8}
.legend i{width:22px;height:15px;border-radius:2px;border:1.5px solid;flex:none}
.back{display:block;background:none;border:none;color:var(--accent);font:500 14px var(--sans);padding:8px 0;cursor:pointer;min-height:44px}
.list a{display:block;padding:6px 0;color:var(--accent);font-size:14px;text-decoration:none;border-bottom:1px solid #EEF0F3}
.list a:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:1fr auto;font-size:13.5px;border-top:1px solid var(--line)}
.kv span{padding:6px 0;border-bottom:1px solid #EEF0F3}
.kv span:nth-child(even){text-align:right;font-weight:600}
.foot{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.5}
@media (max-width:900px){
  body{height:auto;overflow:auto}
  main{grid-template-columns:1fr}
  #mapwrap{height:62vh}
  aside{border-left:none;border-top:1px solid var(--line)}
  .notice{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

        <g id="rooms"></g>
        <g font-family="IBM Plex Sans Condensed, sans-serif">
          <rect x="0" y="85" width="5" height=".8" fill="#1d1d1b"/><rect x="5" y="85" width="5" height=".8" fill="#fff" stroke="#1d1d1b" stroke-width="1"/>

          <text x="0" y="87.6" font-size=".9">0</text><text x="9.5" y="87.6" font-size=".9">10</text><text x="19" y="87.6" font-size=".9">20 m</text>

    <div class="tools">
      <button id="zin" aria-label="Aproximar">+</button>

    <div class="hint">Arraste para mover, use a roda do mouse ou dois dedos para o zoom e toque num ambiente para ver os detalhes.</div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

const svg=document.getElementById('map'), wrap=document.getElementById('mapwrap'), panel=document.getElementById('panel');
const NS='http://www.w3.org/2000/svg';
const FULL={x:-6,y:-10,w:94,h:102};
let vb={...FULL};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setVB(v){vb=v;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}
function animateTo(t){
  if(reduce){setVB(t);return}
  const s={...vb},t0=performance.now(),d=420;
  function step(n){const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);
    setVB({x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e});
    if(k<1)requestAnimationFrame(step)}
  requestAnimationFrame(step)
}
function fitAspect(b){const r=wrap.clientWidth/wrap.clientHeight; let {x,y,w,h}=b;
  if(w/h<r){const nw=h*r;x-=(nw-w)/2;w=nw}else{const nh=w/r;y-=(nh-h)/2;h=nh} return {x,y,w,h}}
// build rooms
const G=document.getElementById('rooms');
function wrapText(label,w,fs){const words=label.split(' '),max=Math.max(3,Math.floor((w-.4)/(fs*.48)));const lines=[];let cur='';
  for(const wd of words){if((cur+' '+wd).trim().length>max&&cur){lines.push(cur);cur=wd}else cur=(cur+' '+wd).trim()} if(cur)lines.push(cur);return lines}
for(const r of DATA.rooms){
  const s=DATA.setores[r.setor];
  const g=document.createElementNS(NS,'g');g.setAttribute('class','room');g.dataset.id=r.id;g.dataset.setor=r.setor;
  g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',r.nome+', '+r.area);
  const rc=document.createElementNS(NS,'rect');rc.setAttribute('class','body');
  Object.entries({x:r.x,y:r.y,width:r.w,height:r.h,fill:s.fill,stroke:s.line,'stroke-width':1.4}).forEach(([k,v])=>rc.setAttribute(k,v));
  if(r.setor==='P')rc.setAttribute('stroke-dasharray','6 4');
  g.appendChild(rc);
  const vertical=r.h>r.w*2.2&&r.w<3.5;
  const fs=r.fs, lines=wrapText(r.label,vertical?r.h:r.w,fs);
  const t=document.createElementNS(NS,'text');t.setAttribute('font-size',fs);t.setAttribute('text-anchor','middle');
  const cx=r.x+r.w/2, cy=r.y+r.h/2, lh=fs*1.15, y0=cy-(lines.length-1)*lh/2+fs*.35;
  lines.forEach((ln,i)=>{const sp=document.createElementNS(NS,'tspan');sp.setAttribute('x',cx);sp.setAttribute('y',y0+i*lh);sp.textContent=ln;t.appendChild(sp)});
  if(vertical)t.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);
  g.appendChild(t);
  g.addEventListener('click',e=>{if(moved)return;select(r.id,true)});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(r.id,true)}});
  G.appendChild(g);
}
const byId=Object.fromEntries(DATA.rooms.map(r=>[r.id,r]));
function overview(){
  document.querySelectorAll('.room.sel').forEach(n=>n.classList.remove('sel'));
  const sets=Object.entries(DATA.setores);
  panel.innerHTML=`<h2>Como ler esta planta</h2>
  <p>A Base reúne, num só pavimento, o Depósito Tipo 1, a Central de UBV Tipo 1, a barreira sanitária dos trabalhadores e a administração da Divisão de Controle Vetorial. Selecione um ambiente na planta ou na lista para ver o que o plano exige para ele.</p>
  <h3>Setores</h3><div class="legend">${sets.map(([k,s])=>`<button data-set="${k}" aria-pressed="false"><i style="background:${s.fill};border-color:${s.line}"></i>${esc(s.nome)}</button>`).join('')}</div>
  <h3>Áreas do Quadro 3 do plano</h3>
  <div class="kv"><span>Acesso e administração</span><span>330 m²</span><span>Barreira sanitária</span><span>213 m²</span><span>Depósito Tipo 1</span><span>340 m² + a definir</span><span>Central de UBV Tipo 1</span><span>110 m² + a definir</span><span>Área útil</span><span>~ 993 m²</span><span>Área construída (+20%)</span><span>~ 1.192 m²</span></div>
  <h3>Critérios da Funasa (2007) atendidos no desenho</h3>
  <ul><li>Depósitos e resíduos a 10 m ou mais das divisas.</li><li>Depósito de praguicidas a 34 m da administração; o mínimo é 10 m.</li><li>Depósito da Central de UBV a 10 m ou mais das áreas de apoio, dos vestiários e da administração.</li><li>Oficina sem acesso direto à administração, ao almoxarifado e aos vestiários.</li><li>Adulticidas e larvicidas em ambientes separados; resíduos isolados do piso ao teto.</li><li>Pátio com cerca de 30 m diante da plataforma, para docagem de carretas de 18 m.</li></ul>
  <h3>Barreira sanitária</h3><p>Quem volta do campo entra pelo vestiário sujo, passa obrigatoriamente pelos chuveiros e sai pelo vestiário limpo, com roupa pessoal. Os conjuntos masculino e feminino são independentes.</p>
  <p class="foot">Estudo preliminar elaborado a partir do Plano de Necessidades para Construção da Base de Endemias (PLN.SVES.001, SVES/SEMUS). Terreno, norte e acesso são hipotéticos; as medidas do desenho são aproximadas. Não substitui o projeto arquitetônico, que depende do terreno real e de profissional habilitado com RRT ou ART.</p>`;
  panel.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>toggleSet(b)));
}
function toggleSet(b){
  const on=b.getAttribute('aria-pressed')!=='true';
  panel.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed','false'));
  document.querySelectorAll('.room').forEach(n=>n.classList.remove('inset'));
  svg.classList.toggle('dim',on);
  if(on){b.setAttribute('aria-pressed','true');const k=b.dataset.set;
    const rs=DATA.rooms.filter(r=>r.setor===k);
    rs.forEach(r=>document.querySelector(`.room[data-id="${r.id}"]`).classList.add('inset'));
    let x1=Math.min(...rs.map(r=>r.x)),y1=Math.min(...rs.map(r=>r.y)),x2=Math.max(...rs.map(r=>r.x+r.w)),y2=Math.max(...rs.map(r=>r.y+r.h));
    animateTo(fitAspect({x:x1-4,y:y1-4,w:x2-x1+8,h:y2-y1+8}));
    let list=panel.querySelector('.list'); if(list)list.remove();
    list=document.createElement('div');list.className='list';
    list.innerHTML=rs.map(r=>`<a href="#${r.id}">${esc(r.nome)}</a>`).join('');
    b.after(list);
  } else {const l=panel.querySelector('.list'); if(l)l.remove(); animateTo(fitAspect(FULL))}
}
function select(id,zoom){
  const r=byId[id]; if(!r){overview();return}
  svg.classList.remove('dim');document.querySelectorAll('.room').forEach(n=>n.classList.remove('inset'));
  document.querySelectorAll('.room.sel').forEach(n=>n.classList.remove('sel'));
  document.querySelector(`.room[data-id="${id}"]`).classList.add('sel');
  if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
  if(zoom){const pad=Math.max(9,Math.max(r.w,r.h)*1.1);animateTo(fitAspect({x:r.x-pad,y:r.y-pad,w:r.w+2*pad,h:r.h+2*pad}))}
  const s=DATA.setores[r.setor];
  let h=`<button class="back" id="back">Voltar à visão geral</button>
  <span class="chip"><i style="background:${s.fill};border-color:${s.line}"></i>${esc(s.nome)}</span>
  <h2>${esc(r.nome)}</h2><div class="area">Área: ${esc(r.area)}</div>`;
  if(r.desc)h+=`<p>${esc(r.desc)}</p>`;
  if(r.rows&&r.rows.length){h+=`<h3>Equipamentos e mobiliário</h3><table><thead><tr><th>Item</th><th>Qtd.</th><th>Especificação</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.item)}</td><td class="q">${esc(x.qtd)}</td><td>${esc(x.esp)}</td></tr>`).join('')}</tbody></table>`}
  if(r.reqs&&r.reqs.length){h+=`<h3>Requisitos construtivos</h3><ul>${r.reqs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
  if(r.areaPlano&&r.areaPlano!==r.area)h+=`<p class="foot">Área indicada na tabela do plano: ${esc(r.areaPlano)}</p>`;
  h+=`<p class="foot">Fonte: Plano de Necessidades PLN.SVES.001, Anexo A. Posição e dimensões no desenho são aproximadas.</p>`;
  panel.innerHTML=h;panel.scrollTop=0;
  document.getElementById('back').addEventListener('click',()=>{history.replaceState(null,'',location.pathname);overview();animateTo(fitAspect(FULL))});
}
// pan & zoom
function toWorld(cx,cy){const b=svg.getBoundingClientRect(),s=Math.max(vb.w/b.width,vb.h/b.height);
  const ox=(b.width*s-vb.w)/2, oy=(b.height*s-vb.h)/2; return {x:vb.x-ox+(cx-b.left)*s,y:vb.y-oy+(cy-b.top)*s,s}}
function zoomAt(cx,cy,f){const p=toWorld(cx,cy);let w=Math.min(Math.max(vb.w*f,6),160),k=w/vb.w;
  setVB({x:p.x-(p.x-vb.x)*k,y:p.y-(p.y-vb.y)*k,w,h:vb.h*k})}
wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0015))},{passive:false});
const ptrs=new Map();let moved=false,last=null,pinch=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.tools'))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;last={x:e.clientX,y:e.clientY};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
wrap.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch/d);moved=true}pinch=d;return}
  const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3){moved=true;wrap.classList.add('dragging');if(!wrap.hasPointerCapture(e.pointerId))wrap.setPointerCapture(e.pointerId)}
  if(moved){const s=toWorld(0,0).s;setVB({...vb,x:vb.x-dx*s,y:vb.y-dy*s})}last={x:e.clientX,y:e.clientY}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;wrap.classList.remove('dragging');setTimeout(()=>{moved=false},0)}
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
const center=()=>{const b=wrap.getBoundingClientRect();return [b.left+b.width/2,b.top+b.height/2]};
document.getElementById('zin').onclick=()=>zoomAt(...center(),0.7);
document.getElementById('zout').onclick=()=>zoomAt(...center(),1.4);
document.getElementById('zall').onclick=()=>animateTo(fitAspect(FULL));
addEventListener('hashchange',()=>select(location.hash.slice(1),true));
const start=location.hash.slice(1);
if(byId[start])select(start,true);else overview();
</script>
